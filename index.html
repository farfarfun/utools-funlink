<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>FunLink</title>
    <link rel="icon" href="./logo.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button class="brand" id="homeButton" type="button" aria-label="返回全部网址">
          <img src="./logo.png" alt="" width="30" height="30" />
          <span>FunLink</span>
        </button>
        <label class="search-field">
          <span class="sr-only">搜索网址</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="search" placeholder="搜索卡片" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <div class="top-actions">
          <button class="icon-button" id="addButton" type="button" title="添加网址" aria-label="添加网址">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-button" id="themeButton" type="button" title="切换主题" aria-label="切换主题">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button class="icon-button" id="settingsButton" type="button" title="设置" aria-label="打开设置">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          </button>
        </div>
      </header>

      <nav class="primary-nav" id="primaryNav" aria-label="网址分类"></nav>

      <main class="workspace">
        <aside class="secondary-nav" id="secondaryNav" aria-label="二级分类"></aside>
        <section class="content" aria-live="polite">
          <div class="view-heading">
            <div>
              <h1 id="viewTitle">全部网址</h1>
              <p id="viewMeta"></p>
            </div>
            <button class="button secondary" id="manageCategoriesButton" type="button">管理分类</button>
          </div>
          <div class="bookmark-grid" id="bookmarkGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <div class="empty-mark">FL</div>
            <h2>这里还没有网址</h2>
            <p>添加一张卡片，或切换到其他分类。</p>
            <button class="button primary" id="emptyAddButton" type="button">添加网址</button>
          </div>
        </section>
      </main>

      <button class="trash-button" id="trashButton" type="button" aria-label="打开废纸篓" title="废纸篓">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>
        <span id="trashCount" hidden>0</span>
      </button>

      <div class="context-menu" id="contextMenu" role="menu" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      <dialog id="bookmarkDialog" class="modal bookmark-modal">
        <form id="bookmarkForm" method="dialog">
          <div class="modal-header">
            <div class="modal-title-icon" id="bookmarkPreview">FL</div>
            <div><h2 id="bookmarkDialogTitle">添加网址</h2><p>保存到你的网址导航</p></div>
            <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
          </div>
          <input id="bookmarkId" type="hidden" />
          <label>网址 <input id="bookmarkUrl" name="url" type="url" placeholder="https://example.com" required /></label>
          <div class="form-row">
            <label>名称 <input id="bookmarkTitle" name="title" maxlength="30" required /></label>
            <label>分类 <select id="bookmarkCategory" name="category"></select></label>
          </div>
          <label>简介 <input id="bookmarkDescription" name="description" maxlength="80" /></label>
          <div class="form-row icon-row">
            <fieldset>
              <legend>图标</legend>
              <div class="segmented">
                <label><input type="radio" name="iconType" value="text" checked /><span>文字</span></label>
                <label><input type="radio" name="iconType" value="image" /><span>图片</span></label>
              </div>
            </fieldset>
            <label id="iconValueLabel">图标文字 <input id="bookmarkIconValue" maxlength="4" placeholder="FL" /></label>
            <label>图标颜色 <input id="bookmarkColor" type="color" value="#16b8c7" /></label>
          </div>
          <label>指定浏览器
            <select id="bookmarkBrowser">
              <option value="">系统默认</option><option value="chrome">Chrome</option><option value="chrome-incognito">Chrome 无痕</option>
              <option value="edge">Edge</option><option value="edge-inprivate">Edge InPrivate</option><option value="firefox">Firefox</option><option value="safari">Safari</option>
            </select>
          </label>
          <div class="check-row">
            <label><input id="bookmarkFavorite" type="checkbox" /> 加入常用</label>
            <label><input id="bookmarkQuick" type="checkbox" /> 网页快开</label>
          </div>
          <div class="form-error" id="bookmarkError" role="alert"></div>
          <div class="modal-actions"><button class="button secondary close-dialog" type="button">取消</button><button class="button primary" type="submit">保存</button></div>
        </form>
      </dialog>

      <dialog id="categoryDialog" class="modal category-modal">
        <form id="categoryForm" method="dialog">
          <div class="modal-header">
            <div><h2>分类管理</h2><p>一级分类显示在顶部，二级分类显示在侧边。</p></div>
            <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
          </div>
          <div class="category-add-row">
            <label>分类名称 <input id="newCategoryName" maxlength="12" required /></label>
            <label>上级分类 <select id="newCategoryParent"><option value="">无，创建一级分类</option></select></label>
            <button class="button primary" type="submit">添加</button>
          </div>
          <div class="category-list" id="categoryList"></div>
        </form>
      </dialog>

      <dialog id="noteDialog" class="modal note-modal">
        <form id="noteForm" method="dialog">
          <div class="modal-header">
            <div><h2 id="noteTitle">卡片笔记</h2><p>自动保存在网址卡片中</p></div>
            <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
          </div>
          <input id="noteBookmarkId" type="hidden" />
          <label class="note-field"><span class="sr-only">笔记内容</span><textarea id="noteContent" placeholder="记录账号提示、使用说明或待办事项..." spellcheck="true"></textarea></label>
          <div class="modal-actions"><span class="keyboard-help"><kbd>Ctrl</kbd> + <kbd>S</kbd> 保存</span><button class="button secondary close-dialog" type="button">取消</button><button class="button primary" type="submit">保存笔记</button></div>
        </form>
      </dialog>

      <dialog id="settingsDialog" class="modal settings-modal">
        <form method="dialog">
          <div class="modal-header">
            <div><h2>设置</h2><p>外观与数据管理</p></div>
            <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
          </div>
          <section class="settings-section"><h3>主题</h3><div class="segmented" id="themeOptions">
            <label><input type="radio" name="theme" value="light" /><span>浅色</span></label><label><input type="radio" name="theme" value="dark" /><span>深色</span></label><label><input type="radio" name="theme" value="system" /><span>跟随系统</span></label>
          </div></section>
          <section class="settings-section"><h3>数据管理</h3><div class="settings-actions">
            <button class="button secondary" id="exportButton" type="button">导出备份</button><button class="button secondary" id="restoreButton" type="button">恢复备份</button><button class="button secondary" id="importButton" type="button">导入浏览器书签</button>
          </div><p>支持 FunLink JSON 备份，以及 Chrome、Edge、Firefox 导出的 HTML 书签。</p></section>
          <section class="settings-section danger-zone"><h3>重置</h3><button class="button danger" id="resetButton" type="button">恢复示例数据</button></section>
        </form>
      </dialog>

      <input id="restoreInput" type="file" accept="application/json,.json" hidden />
      <input id="importInput" type="file" accept="text/html,.html,.htm" hidden />
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
